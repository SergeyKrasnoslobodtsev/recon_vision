[project]
requires-python = ">=3.9,<3.12"
name = "recon_vision"
version = "0.1.0"
description = "A short description of the project"
authors = [
    { name = "Sergey Krasnoslobodtsev", email = "solodeveloper.ai@gmail.com" },
]
dependencies = [
    "fastapi==0.128.0",
    "uvicorn==0.29.0",
    "pydantic>=2.12.5",
    "requests>=2.32.0",
    "loguru>=0.7.0",
    "httpx>=0.27.0",
    "diskcache>=5.6.3",
    "pymupdf>=1.26.5",
    "pillow>=11.3.0",
    "setuptools>=80.9.0",
    "paddleocr==3.3.2",
    # "super-image>=0.2.0",    
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2",
    "pytest-asyncio>=0.20.3",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.8",
    "matplotlib>=3.9.4",
]
aws = [
    "mangum>=0.17.0"
]

[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
]

line-length = 120
indent-width = 4

target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true


