dpi: 200
ocr_confidence_threshold: 0.45

image_preprocessor:
  kernel: 3
  sigma: 1.5
  amount: 1.0

table_preprocessor:
  gamma: 10.0
  block_size: 11
  C: 5

table_detector:
  min_area_frac: 0.005
  min_w: 50
  min_h: 30
  min_overlap_ratio: 0.5
  mode_merge_cells: cols

paddleocr:
  text_recognition_model_name: cyrillic_PP-OCRv5_mobile_rec
  text_recognition_model_dir: ./models/cyrillic_PP-OCRv5_mobile_rec
  text_detection_model_name: PP-OCRv5_server_det
  text_detection_model_dir: ./models/PP-OCRv5_server_det
  use_doc_orientation_classify: false
  use_doc_unwarping: false
  use_textline_orientation: false
  device: cpu

page_orientation_preprocessor:
  model_name: PP-LCNet_x1_0_doc_ori
  model_dir: ./models/PP-LCNet_x1_0_doc_ori
  min_orientation_score: 0.79
  gamma: 10.0
  block_size: 15
  C: 5
  scale_horizontal_line: 40
  height_vertical_line: 40

paragraph_preprocessor:
  adaptive_block_size: 21
  adaptive_c: 20
  dilate_kw_ratio: 0.4
  dilate_kh_ratio: 0.8
  dilate_kw_min: 10
  dilate_kh_min: 7
  erode_kw: 9
  page_bottom_cutoff: 0.9

paragraph_detector:
  reading_order_band_k: 3.0
